<svg width="100%" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>How claudex works</title>
<desc>A task is routed to Codex in a chosen mode, Codex runs a read-only pass, Claude reconciles the result on the merits, and returns a sharper answer. Below: the 14 modes grouped, and the heavy jobs.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="1" y="1" width="998" height="498" rx="16" fill="#0E1117" stroke="#232A33" stroke-width="1"/>

<text x="40" y="54" font-size="26" font-weight="500" fill="#E6EDF3">How claudex works</text>
<text x="40" y="82" font-size="15" font-weight="400" fill="#8B949E">Hand any work to a second model in the mode that fits — then keep only what survives.</text>

<!-- pipeline -->
<g>
<rect x="40" y="140" width="160" height="84" rx="8" fill="#1C2128" stroke="#30363D" stroke-width="1"/>
<text x="120" y="188" font-size="15" font-weight="500" fill="#C9D1D9" text-anchor="middle">Your task</text>

<rect x="235" y="140" width="160" height="84" rx="8" fill="#2A1712" stroke="#D85A30" stroke-width="1"/>
<text x="315" y="178" font-size="15" font-weight="500" fill="#F5C4B3" text-anchor="middle">Pick a mode</text>
<text x="315" y="200" font-size="12" font-weight="400" fill="#F0997B" text-anchor="middle">14 modes</text>

<rect x="430" y="140" width="160" height="84" rx="8" fill="#0C2A22" stroke="#1D9E75" stroke-width="1"/>
<text x="510" y="178" font-size="15" font-weight="500" fill="#9FE1CB" text-anchor="middle">Codex pass</text>
<text x="510" y="200" font-size="12" font-weight="400" fill="#5DCAA5" text-anchor="middle">read-only</text>

<rect x="625" y="140" width="160" height="84" rx="8" fill="#2A1712" stroke="#D85A30" stroke-width="1"/>
<text x="705" y="178" font-size="15" font-weight="500" fill="#F5C4B3" text-anchor="middle">Claude reconciles</text>
<text x="705" y="200" font-size="12" font-weight="400" fill="#F0997B" text-anchor="middle">on the merits</text>

<rect x="820" y="140" width="160" height="84" rx="8" fill="#0C2A22" stroke="#1D9E75" stroke-width="1"/>
<text x="900" y="178" font-size="15" font-weight="500" fill="#9FE1CB" text-anchor="middle">Sharper answer</text>
<text x="900" y="200" font-size="12" font-weight="400" fill="#5DCAA5" text-anchor="middle">corrected / synthesized</text>

<line x1="202" y1="182" x2="233" y2="182" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="397" y1="182" x2="428" y2="182" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="592" y1="182" x2="623" y2="182" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="787" y1="182" x2="818" y2="182" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arr)"/>
</g>

<text x="500" y="256" font-size="13" font-weight="400" fill="#8B949E" text-anchor="middle">Claude judges Codex on the merits — CONCEDE · DEFEND · PARTIAL, or a diff. Unsourced facts verified first.</text>

<line x1="40" y1="282" x2="960" y2="282" stroke="#232A33" stroke-width="1"/>

<text x="40" y="312" font-size="16" font-weight="500" fill="#C9D1D9">14 modes, grouped</text>

<!-- left column: orange group names -->
<text x="40" y="344" font-size="13"><tspan font-weight="500" fill="#F0997B">framing</tspan><tspan font-weight="400" fill="#8B949E"> — scope</tspan></text>
<text x="40" y="376" font-size="13"><tspan font-weight="500" fill="#F0997B">truth / evidence</tspan><tspan font-weight="400" fill="#8B949E"> — fact-check, support, conformance</tspan></text>
<text x="40" y="408" font-size="13"><tspan font-weight="500" fill="#F0997B">critique</tspan><tspan font-weight="400" fill="#8B949E"> — oppo, steelman, bias-scan</tspan></text>
<text x="40" y="440" font-size="13"><tspan font-weight="500" fill="#F0997B">solution</tspan><tspan font-weight="400" fill="#8B949E"> — parallel (default), prior-art</tspan></text>

<!-- right column: teal group names -->
<text x="520" y="344" font-size="13"><tspan font-weight="500" fill="#5DCAA5">robustness</tspan><tspan font-weight="400" fill="#8B949E"> — probe, threatmodel</tspan></text>
<text x="520" y="376" font-size="13"><tspan font-weight="500" fill="#5DCAA5">decision</tspan><tspan font-weight="400" fill="#8B949E"> — referee</tspan></text>
<text x="520" y="408" font-size="13"><tspan font-weight="500" fill="#5DCAA5">change-risk</tspan><tspan font-weight="400" fill="#8B949E"> — premortem</tspan></text>
<text x="520" y="440" font-size="13"><tspan font-weight="500" fill="#5DCAA5">trim</tspan><tspan font-weight="400" fill="#8B949E"> — redpen</tspan></text>

<text x="40" y="476" font-size="12" font-weight="400" fill="#6E7681">Heavy jobs — delegate: whole-folder audit (claudex owns it) · codex:rescue: write-capable takeover.</text>
</svg>
